<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Validação</title>
    <link rel="stylesheet" href="./main.css">
</head>

<body>
    <div class="container">
        <h1>Formulário de Validação</h1>

        <form id="form-validacao">
            <label for="campo-a">Campo A:</label>
            <input type="number" id="campo-a" step="any" required>
            <label for="campo-b">Campo B:</label>
            <input type="number" id="campo-b" step="any" required>
            <p class="error-message">
                B deve ser maior que A.
            </p>

            <button type="submit">Validar</button>

        </form>

        <p class="success-message"></p>

    </div>

    <script src="./main.js"></script>
</body>
</html>
